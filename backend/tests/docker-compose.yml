services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    image: gomicro/goose
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"
    volumes:
      - ../sql/migrations:/migrations:ro
      - ../sql/seeds:/seeds:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        goose -dir /migrations -no-versioning up
        goose -dir /seeds -no-versioning up

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 5

  nats-box:
    image: natsio/nats-box:latest
    restart: "no"
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ../deployments/nats-stream.json:/config/nats-stream.json:ro
      - ../deployments/nats-consumer.json:/config/nats-consumer.json:ro
    entrypoint:
      - sh
      - -c
      - |
        nats stream info MESSAGES -s nats:4222 >/dev/null 2>&1 || nats stream add --config /config/nats-stream.json -s nats:4222
        nats consumer info MESSAGES message-service -s nats:4222 >/dev/null 2>&1 || nats consumer add --config /config/nats-consumer.json -s nats:4222

  scylla:
    image: scylladb/scylla:6.2
    restart: unless-stopped
    command: --smp 1 --memory 1G --developer-mode 1
    volumes:
      - ../scylla:/scylla:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 5s
      timeout: 5s
      retries: 5

  scylla-init:
    image: scylladb/scylla:6.2
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ../scylla/init.cql:/init.cql
    entrypoint: ["cqlsh", "scylla", "-f", "/init.cql"]

  realtime-service:
    build:
      context: ..
      dockerfile: cmd/realtime/Dockerfile
    ports:
      - "8080-8089:8080"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-testing}
      SERVER_ADDRESS: 0.0.0.0:8080
      DB_ADDRESS: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      NATS_ADDRESS: nats:4222
      NATS_SUBJECT: message
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthz",
        ]
      interval: 3s
      timeout: 3s
      retries: 5

  worker-service:
    build:
      context: ..
      dockerfile: cmd/worker/Dockerfile
    restart: unless-stopped
    environment:
      NATS_ADDRESS: nats:4222
      NATS_STREAM: MESSAGES
      NATS_DURABLE: message-service
      NATS_SUBJECT: messages.unprocessed.*
      SCYLLA_HOSTS: scylla:9042
      SCYLLA_KEYSPACE: aether
    depends_on:
      nats:
        condition: service_healthy
      scylla:
        condition: service_healthy
