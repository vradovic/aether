worker_processes auto;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format upstream '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log upstream;

    sendfile on;
    tcp_nodelay on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP API. Requests are short lived and stateless, so the default
    # round robin is a good fit.
    upstream api_backend {
        server api-service:8081;
        keepalive 32;
    }

    # WebSocket fan-out. Connections are long lived and their lifetimes vary
    # wildly, so balance on open connections rather than request count.
    #
    # A hostname resolving to several container addresses is expanded into one
    # upstream server per address, which is what lets least_conn spread load
    # across scaled replicas. Addresses are resolved once at startup, so after
    # `docker compose up --scale realtime-service=N` reload nginx with
    # `docker compose exec nginx nginx -s reload` to pick up the new replicas.
    upstream realtime_backend {
        least_conn;
        server realtime-service:8080;
    }

    server {
        listen 80;

        # /api/conversations -> api-service /conversations
        location /api/ {
            proxy_pass http://api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://realtime_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Idle sockets must survive quiet conversations.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}
