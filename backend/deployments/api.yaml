apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: aether/api
          imagePullPolicy: Never
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SERVER_ADDRESS, value: ":8081" }
            - { name: DB_ADDRESS, value: "postgres://postgres:password@postgres:5432/postgres" }
            - { name: JWT_SIGNING_KEY, value: "kjflsadjflkjdslkfjadslkjflkdsajflksajdflkdsjkfljsadflkjsldkf" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [{ port: 8081, targetPort: 8081 }]