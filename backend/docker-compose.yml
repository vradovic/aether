services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.32.5
    restart: unless-stopped

    environment:
      SWAGGER_JSON: /openapi/openapi.yaml

    ports:
      - "8081:8080"

    volumes:
      - ./docs/openapi.yaml:/openapi/openapi.yaml:ro

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: [ "-js", "-m", "8222" ]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 5

  nats-box:
    image: natsio/nats-box:latest
    restart: "no"
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./deployments/nats-stream.json:/config/nats-stream.json:ro
      - ./deployments/nats-consumer.json:/config/nats-consumer.json:ro
    entrypoint:
      - sh
      - -c
      - |
        nats stream info MESSAGES -s nats:4222 >/dev/null 2>&1 || nats stream add --config /config/nats-stream.json -s nats:4222
        nats consumer info MESSAGES message-service -s nats:4222 >/dev/null 2>&1 || nats consumer add --config /config/nats-consumer.json -s nats:4222

  scylla:
    image: scylladb/scylla:6.2
    restart: unless-stopped
    command: --smp 1 --memory 1G --developer-mode 1
    ports:
      - "9042:9042"
    volumes:
      - scylla_data:/var/lib/scylla
      - ./scylla:/scylla:ro

volumes:
  postgres_data:
  scylla_data:
